<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pràctica: pregunta, resposta i correcció.">
  <title>Pràctica — Sistemes de Mesura</title>
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/shell.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/pages.css">
  <script src="static/js/i18n.js"></script>
  <script src="static/js/shell.js"></script>
  <script src="static/js/mathjax-config.js"></script>
  <script src="static/js/vendor/mathjax/3.2.2/tex-svg.js"></script>
  <script src="static/js/csrf.js" defer></script>
  <script src="static/js/app.js" defer></script>
  <script src="static/js/ui.js" defer></script>
  <script src="static/js/math-renderer.js" defer></script>
  <script src="static/js/practice.js" defer></script>
</head>
<body data-route="practice.html">
  <a class="skip-link" href="#main">Salta al contingut</a>
  <main class="main" id="main">
    <div class="page">
      <nav class="breadcrumbs" aria-label="Ruta"><ol><li><a href="index.html">Inici</a></li><li><a href="temari.html">Temari</a></li><li aria-current="page">Pràctica</li></ol></nav>
      <div class="page-header">
        <h1>Pràctica</h1>
        <p>Configura, respon i rep correcció. La correcció la fa el backend.</p>
      </div>
      <section class="card practice-config" aria-labelledby="h-cfg">
        <h2 class="h3" id="h-cfg">Configuració</h2>
        <div class="field">
          <label class="label" for="cfg-topic">Tema (1–10)</label>
          <input class="input" id="cfg-topic" type="number" min="1" max="10" value="2">
        </div>
        <div class="field">
          <label class="label" for="cfg-type">Tipus de pregunta</label>
          <select class="select" id="cfg-type"></select>
        </div>
        <div class="field">
          <label class="label" for="cfg-diff">Dificultat</label>
          <select class="select" id="cfg-diff"></select>
        </div>
        <div class="field">
          <label class="label" for="cfg-seed">Seed (0 = aleatori)</label>
          <input class="input" id="cfg-seed" type="number" min="0" value="0">
        </div>
        <button class="button" type="button" id="cfg-go">Genera pregunta</button>
      </section>
      <div id="q-box" aria-live="polite"></div>
      <div id="a-box"></div>
      <div id="c-box" aria-live="polite"></div>
    </div>
  </main>
</body>
</html>
