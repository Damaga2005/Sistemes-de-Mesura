<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Exàmens: els meus exàmens, historial i creació de nous exàmens.">
  <title>Exàmens — Sistemes de Mesura</title>
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/shell.css">
  <link rel="stylesheet" href="static/css/components.css">
  <link rel="stylesheet" href="static/css/pages.css">
  <script src="static/js/i18n.js"></script>
  <script src="static/js/shell.js"></script>
  <script src="static/js/csrf.js" defer></script>
  <script src="static/js/app.js" defer></script>
  <script src="static/js/ui.js" defer></script>
  <script src="static/js/exams.js" defer></script>
</head>
<body data-route="exams.html">
  <a class="skip-link" href="#main">Salta al contingut</a>
  <main class="main" id="main">
    <div class="page">
      <nav class="breadcrumbs" aria-label="Ruta"><ol><li><a href="index.html">Inici</a></li><li aria-current="page">Exàmens</li></ol></nav>
      <div class="page-header">
        <h1>Exàmens</h1>
        <p>Els meus exàmens, l'historial i la creació. La correcció i el temporitzador contractual són del backend.</p>
      </div>

      <section class="exam-block" aria-labelledby="h-mine">
        <h2 id="h-mine">Els meus exàmens</h2>
        <div id="exam-list" class="exam-list" aria-live="polite"></div>
      </section>

      <section class="exam-block" aria-labelledby="historial">
        <h2 id="historial">Historial</h2>
        <div id="exam-historial" class="exam-historial" aria-live="polite"></div>
      </section>

      <section class="card exam-new" aria-labelledby="h-new">
        <h2 class="h3" id="h-new">Nou examen (opcions suportades)</h2>
        <div class="field">
          <label class="label" for="cfg-kind">Tipus</label>
          <select class="select" id="cfg-kind">
            <option value="PRACTICE_EXAM">De pràctica (sense temps)</option>
            <option value="MOCK_EXAM" selected>Simulacre (amb temps i revisió)</option>
            <option value="REAL_EXAM">Real (revisió cega)</option>
          </select>
        </div>
        <fieldset>
          <legend class="label">Temes (1–10)</legend>
          <div id="cfg-topics" class="exam-new__topics"></div>
        </fieldset>
        <div class="field">
          <label class="label" for="cfg-count">Nombre de preguntes (1–10)</label>
          <input class="input" id="cfg-count" type="number" min="1" max="10" value="2">
        </div>
        <div class="field">
          <label class="label" for="cfg-type">Tipus de pregunta</label>
          <select class="select" id="cfg-type"></select>
        </div>
        <div class="field">
          <label class="label" for="cfg-diff">Dificultat</label>
          <select class="select" id="cfg-diff"></select>
        </div>
        <div class="field">
          <label class="label" for="cfg-dur">Durada en segons (buit = sense límit)</label>
          <input class="input" id="cfg-dur" type="number" min="60" placeholder="p. ex., 600">
        </div>
        <div class="field">
          <label class="label" for="cfg-seed">Seed (0 = aleatori)</label>
          <input class="input" id="cfg-seed" type="number" min="0" value="0">
        </div>
        <p class="hint">Un cop READY, la definició és immutable (snapshot del backend).</p>
        <button class="button" type="button" id="cfg-go">Crea i prepara</button>
        <div id="cfg-out" aria-live="polite"></div>
      </section>
    </div>
  </main>
</body>
</html>
